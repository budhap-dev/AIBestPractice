<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Everyday GitHub Copilot best practices in VS Code: context, premium requests, prompts and safety." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Copilot Field Guide</title>
    <script>
      try {
        var t = localStorage.getItem('cfg-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        var p = localStorage.getItem('cfg-palette');
        if (/^(ocean|grape|rose|ember|graphite)$/.test(p || '')) document.documentElement.dataset.palette = p;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
